name: NIYVEXA static QA

on:
  push:
    branches: [main]
    paths:
      - "niyvexa/**"
      - ".github/workflows/niyvexa-qa.yml"
  pull_request:
    paths:
      - "niyvexa/**"
      - ".github/workflows/niyvexa-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate inline JavaScript syntax
        run: node niyvexa/check-inline-js.mjs
      - name: Validate manifest and required files
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('niyvexa/manifest.webmanifest', 'utf8'));
          if (!manifest.name || !manifest.start_url || !Array.isArray(manifest.icons) || manifest.icons.length < 1) {
            throw new Error('Manifest is missing required app metadata or icons.');
          }
          for (const file of [
            'niyvexa/index.html',
            'niyvexa/app.html',
            'niyvexa/auth-config.js',
            'niyvexa/sw.js',
            'niyvexa/supabase-schema.sql',
            'niyvexa/privacy.html',
            'niyvexa/terms.html'
          ]) {
            if (!fs.existsSync(file)) throw new Error(`Required file missing: ${file}`);
          }
          const app = fs.readFileSync('niyvexa/app.html', 'utf8');
          const sw = fs.readFileSync('niyvexa/sw.js', 'utf8');
          const sql = fs.readFileSync('niyvexa/supabase-schema.sql', 'utf8');
          if (!app.includes('Number.isInteger(p.age)')) throw new Error('Age integer validation missing.');
          if (!sw.includes('"./auth-config.js"')) throw new Error('Auth config is not in the offline core cache.');
          if (!sql.includes('alter table private.profile_private enable row level security;')) throw new Error('Private birth-date table RLS is not enabled.');
          if (!sql.includes('revoke all on table private.profile_private from public, anon, authenticated;')) throw new Error('Client access to private birth dates is not revoked.');
          console.log('Manifest, required files, app invariants, and private birth-date access controls validated.');
          NODE
      - name: Check whitespace errors
        run: git diff --check
