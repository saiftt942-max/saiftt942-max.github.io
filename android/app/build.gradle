plugins {
    id 'com.android.application'
}

def uploadStore = System.getenv("NIYVEXA_KEYSTORE_PATH")
def uploadStorePassword = System.getenv("NIYVEXA_KEYSTORE_PASSWORD")
def uploadKeyAlias = System.getenv("NIYVEXA_KEY_ALIAS")
def uploadKeyPassword = System.getenv("NIYVEXA_KEY_PASSWORD")
def signingConfigured = uploadStore && uploadStorePassword && uploadKeyAlias && uploadKeyPassword

android {
    namespace 'app.niyvexa.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'app.niyvexa.mobile'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (signingConfigured) {
                storeFile file(uploadStore)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (signingConfigured) signingConfig signingConfigs.release
        }
    }
}
